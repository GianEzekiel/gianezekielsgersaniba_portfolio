name: Vercel Production Deployment
env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_AUTH_TOKEN }}
on:
  push:
    branches:
      - main
jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate and normalize Vercel credentials
        run: |
          if [ -z "$(echo "$VERCEL_TOKEN" | tr -d '[:space:]')" ]; then
            echo "Missing VERCEL_TOKEN (or VERCEL_AUTH_TOKEN) secret."
            exit 1
          fi
          if [ -z "$(echo "$VERCEL_ORG_ID" | tr -d '[:space:]')" ] || [ -z "$(echo "$VERCEL_PROJECT_ID" | tr -d '[:space:]')" ]; then
            echo "Missing VERCEL_ORG_ID or VERCEL_PROJECT_ID (set either as repository variables or secrets)."
            exit 1
          fi
          echo "VERCEL_TOKEN=$(echo "$VERCEL_TOKEN" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "VERCEL_ORG_ID=$(echo "$VERCEL_ORG_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "VERCEL_PROJECT_ID=$(echo "$VERCEL_PROJECT_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Ensure clean Vercel project linkage
        run: rm -rf .vercel

      - name: Pull Vercel Environment Information
        # If your project lives in a subfolder (monorepo), add:
        # working-directory: ./apps/web
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Project Artifacts
        # working-directory: ./apps/web
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Project Artifacts to Vercel
        # working-directory: ./apps/web
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
